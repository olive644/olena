    <!-- Fonte carregada de forma não bloqueante: preload + troca do rel para
         'stylesheet' após o download evita que a requisição à Google Fonts
         atrase a primeira renderização da página. O <noscript> garante a
         fonte mesmo sem JavaScript. -->
    <link
      id="google-fonts-preload"
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
