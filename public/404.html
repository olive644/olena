<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, follow" />
    <title>404 · OlenaStudy</title>
    <link rel="icon" href="/olena-favicon-32.png" type="image/png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/paper-recovery.css" />
    <script src="/paper-recovery.js" defer></script>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body data-recovery="404">
    <main class="paper-recovery" id="main-content">
      <header class="paper-recovery__brand">
        <img src="/olena-favicon-180.png" width="32" height="32" alt="" />
        <span class="paper-card-title"
          ><span class="visually-hidden">OlenaStudy</span
          ><span class="paper-card-word"
            ><svg viewBox="0 -18 66 122" aria-hidden="true">
              <use href="/paper-monochrome-alphabet.svg#letter-O" width="66" height="98" /></svg
            ><svg viewBox="0 -18 66 122" aria-hidden="true">
              <use href="/paper-monochrome-alphabet.svg#letter-L" width="66" height="98" /></svg
            ><svg viewBox="0 -18 66 122" aria-hidden="true">
              <use href="/paper-monochrome-alphabet.svg#letter-E" width="66" height="98" /></svg
            ><svg viewBox="0 -18 66 122" aria-hidden="true">
              <use href="/paper-monochrome-alphabet.svg#letter-N" width="66" height="98" /></svg
            ><svg viewBox="0 -18 66 122" aria-hidden="true">
              <use href="/paper-monochrome-alphabet.svg#letter-A" width="66" height="98" /></svg
            ><svg viewBox="0 -18 66 122" aria-hidden="true">
              <use href="/paper-monochrome-alphabet.svg#letter-S" width="66" height="98" /></svg
            ><svg viewBox="0 -18 66 122" aria-hidden="true">
              <use href="/paper-monochrome-alphabet.svg#letter-T" width="66" height="98" /></svg
            ><svg viewBox="0 -18 66 122" aria-hidden="true">
              <use href="/paper-monochrome-alphabet.svg#letter-U" width="66" height="98" /></svg
            ><svg viewBox="0 -18 66 122" aria-hidden="true">
              <use href="/paper-monochrome-alphabet.svg#letter-D" width="66" height="98" /></svg
            ><svg viewBox="0 -18 66 122" aria-hidden="true">
              <use
                href="/paper-monochrome-alphabet.svg#letter-Y"
                width="66"
                height="98"
              /></svg></span
        ></span>
      </header>
      <section class="paper-recovery__sheet" aria-labelledby="recovery-title">
        <div class="paper-recovery__scene" aria-hidden="true">
          <div class="paper-recovery__code">
            <span class="paper-digits"
              ><svg viewBox="0 0 66 98"><use href="/paper-digits.svg#digit-4" /></svg
              ><svg viewBox="0 0 66 98"><use href="/paper-digits.svg#digit-0" /></svg
              ><svg viewBox="0 0 66 98"><use href="/paper-digits.svg#digit-4" /></svg
            ></span>
          </div>
          <img
            class="paper-recovery__olena"
            src="/helena-onboarding-step-1-cutout.webp"
            width="640"
            height="640"
            alt=""
          />
        </div>
        <div class="paper-recovery__copy">
          <h1 id="recovery-title" data-recovery-en="This page went off the map.">
            Esta página saiu do mapa.
          </h1>
          <p
            data-recovery-en="We couldn't find this address. Check the link or return to your space to continue."
          >
            Não encontramos este endereço. Confira o link ou volte ao seu espaço para continuar.
          </p>
          <div class="paper-recovery__actions">
            <a href="/"
              ><img src="/paper-arrow.svg" width="28" height="28" alt="" /><span
                data-recovery-en="Go home"
                >Voltar ao início</span
              ></a
            >
          </div>
        </div>
      </section>
      <footer class="paper-recovery__footer">
        <img src="/olena-favicon-180.png" width="24" height="24" alt="" />
        <img src="/galeria-oli-icon.svg" width="24" height="24" alt="" /><span
          >Galeria.Oli · OlenaStudy</span
        >
      </footer>
    </main>
  </body>
</html>
