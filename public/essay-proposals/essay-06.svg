<svg xmlns="http://www.w3.org/2000/svg" width="640" height="710" viewBox="0 0 640 710" role="img" aria-labelledby="title description"><title id="title">Diagnóstico de depressão: um retrato de 2019</title><desc id="description">Diagnóstico de depressão: um retrato de 2019. Pessoas de 18 anos ou mais, Brasil. 2019. Mulheres: 14,7 %; Homens: 5,1 %; Total da população adulta: 10,2 %. Diagnóstico referido por profissional de saúde mental. Grupos não são parcelas para somar.</desc><rect width="640" height="710" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Diagnóstico de depressão: um</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">retrato de 2019</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Pessoas de 18 anos ou mais, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">2019</text><text x="44" y="218" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">%</text><path d="M44 264v255" stroke="#e4e8f1"/><text x="44" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">0</text><path d="M154.4 264v255" stroke="#e4e8f1"/><text x="154.4" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">20</text><path d="M264.8 264v255" stroke="#e4e8f1"/><text x="264.8" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">40</text><path d="M375.2 264v255" stroke="#e4e8f1"/><text x="375.2" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">60</text><path d="M485.6 264v255" stroke="#e4e8f1"/><text x="485.6" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">80</text><path d="M596 264v255" stroke="#e4e8f1"/><text x="596" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="end">100</text><text x="44" y="288" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Mulheres</text><text x="596" y="288" font-size="25" fill="#075cf4" font-weight="700" text-anchor="end">14,7%</text><rect x="44" y="300" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="300" width="81.14399999999999" height="24" fill="#075cf4" rx="3"/><text x="44" y="368" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Homens</text><text x="596" y="368" font-size="25" fill="#e84452" font-weight="700" text-anchor="end">5,1%</text><rect x="44" y="380" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="380" width="28.151999999999997" height="24" fill="#e84452" rx="3"/><text x="44" y="448" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Total da população adulta</text><text x="596" y="448" font-size="25" fill="#00a459" font-weight="700" text-anchor="end">10,2%</text><rect x="44" y="460" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="460" width="56.303999999999995" height="24" fill="#00a459" rx="3"/><path d="M44 542h552" stroke="#c6cedc"/><text x="44" y="571" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Diagnóstico referido por profissional de saúde mental. Grupos não</text><text x="44" y="595" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">são parcelas para somar.</text><text x="44" y="642" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: IBGE, Pesquisa Nacional de Saúde 2019</text><text x="44" y="678" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>