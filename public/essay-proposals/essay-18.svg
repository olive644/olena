<svg xmlns="http://www.w3.org/2000/svg" width="640" height="853" viewBox="0 0 640 853" role="img" aria-labelledby="title description"><title id="title">Trabalho doméstico também é trabalho com direitos</title><desc id="description">Trabalho doméstico também é trabalho com direitos. Vínculo de emprego doméstico, Brasil. Orientação do MTE; consulta em 2026. Registro: Reconhecimento formal da relação de emprego.; Jornada e descanso: Organização do tempo e dos períodos de repouso.; Proteção social: Direitos e recolhimentos previstos para o vínculo.. Síntese educativa. O vínculo de emprego doméstico e o trabalho de diarista possuem enquadramentos distintos.</desc><rect width="640" height="853" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Trabalho doméstico também é</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">trabalho com direitos</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Vínculo de emprego doméstico, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Orientação do MTE; consulta em 2026</text><rect x="44" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Registro</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Reconhecimento formal</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">da relação de emprego.</text><rect x="330" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Jornada e descanso</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Organização do tempo e</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">dos períodos de</text><text x="350" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">repouso.</text><rect x="44" y="431" width="266" height="218" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="462" r="14" fill="#00a459"/><text x="72" y="468" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="511" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Proteção social</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Direitos e</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">recolhimentos</text><text x="64" y="609" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">previstos para o</text><text x="64" y="636" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">vínculo.</text><path d="M44 685h552" stroke="#c6cedc"/><text x="44" y="714" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Síntese educativa. O vínculo de emprego doméstico e o trabalho de</text><text x="44" y="738" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">diarista possuem enquadramentos distintos.</text><text x="44" y="785" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Ministério do Trabalho e Emprego, trabalho doméstico</text><text x="44" y="821" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>