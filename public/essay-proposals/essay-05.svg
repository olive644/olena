<svg xmlns="http://www.w3.org/2000/svg" width="640" height="826" viewBox="0 0 640 826" role="img" aria-labelledby="title description"><title id="title">Telas: tempo, conteúdo e experiência</title><desc id="description">Telas: tempo, conteúdo e experiência. Infância e adolescência, perspectiva internacional. Relatório de 2025. Tempo: Considerar a presença das telas na rotina.; Conteúdo: Observar o que é acessado e compartilhado.; Experiência: Analisar relações, oportunidades e situações de risco.. Esquema de análise. Não representa limites clínicos de exposição ou diagnóstico.</desc><rect width="640" height="826" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Telas: tempo, conteúdo e</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">experiência</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Infância e adolescência, perspectiva internacional</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Relatório de 2025</text><rect x="44" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Tempo</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Considerar a presença</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">das telas na rotina.</text><rect x="330" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Conteúdo</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Observar o que é</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">acessado e</text><text x="350" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">compartilhado.</text><rect x="44" y="431" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="462" r="14" fill="#00a459"/><text x="72" y="468" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="511" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Experiência</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Analisar relações,</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">oportunidades e</text><text x="64" y="609" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">situações de risco.</text><path d="M44 658h552" stroke="#c6cedc"/><text x="44" y="687" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Esquema de análise. Não representa limites clínicos de exposição</text><text x="44" y="711" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">ou diagnóstico.</text><text x="44" y="758" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: UNICEF, infância em um mundo digital, 2025</text><text x="44" y="794" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>