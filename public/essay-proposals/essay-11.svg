<svg xmlns="http://www.w3.org/2000/svg" width="640" height="625" viewBox="0 0 640 625" role="img" aria-labelledby="title description"><title id="title">Uma trajetória escolar interrompida</title><desc id="description">Uma trajetória escolar interrompida. Pessoas de 14 a 29 anos fora da escola, Brasil. 2024. Não haviam concluído o ensino médio: 8,7 milhões de pessoas. Inclui quem abandonou os estudos e quem nunca frequentou. Não corresponde apenas a abandonos ocorridos em 2024.</desc><rect width="640" height="625" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Uma trajetória escolar</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">interrompida</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Pessoas de 14 a 29 anos fora da escola, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">2024</text><text x="44" y="303" font-size="88" fill="#075cf4" font-weight="700" text-anchor="start">8,7</text><text x="44" y="358" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">milhões de pessoas</text><text x="44" y="394" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">Não haviam concluído o ensino médio</text><path d="M44 457h552" stroke="#c6cedc"/><text x="44" y="486" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Inclui quem abandonou os estudos e quem nunca frequentou. Não</text><text x="44" y="510" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">corresponde apenas a abandonos ocorridos em 2024.</text><text x="44" y="557" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: IBGE, PNAD Contínua Educação 2024</text><text x="44" y="593" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>