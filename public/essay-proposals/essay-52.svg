<svg xmlns="http://www.w3.org/2000/svg" width="640" height="856" viewBox="0 0 640 856" role="img" aria-labelledby="title description"><title id="title">Mobilidade: prioridades na distribuição do espaço</title><desc id="description">Mobilidade: prioridades na distribuição do espaço. Diretrizes da Política Nacional de Mobilidade Urbana. Lei 12.587/2012, art. 6º. Não motorizados: Prioridade sobre modos motorizados.; Transporte coletivo: Prioridade sobre transporte individual motorizado.; Integração: Articulação entre modos e serviços de transporte.. Síntese de diretrizes legais, não participação efetiva dos modos de transporte em uma cidade.</desc><rect width="640" height="856" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Mobilidade: prioridades na</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">distribuição do espaço</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Diretrizes da Política Nacional de Mobilidade Urbana</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Lei 12.587/2012, art. 6º</text><rect x="44" y="218" width="266" height="221" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Não motorizados</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Prioridade sobre modos</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">motorizados.</text><rect x="330" y="218" width="266" height="221" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Transporte</text><text x="350" y="328" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">coletivo</text><text x="350" y="372" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Prioridade sobre</text><text x="350" y="399" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">transporte individual</text><text x="350" y="426" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">motorizado.</text><rect x="44" y="461" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="492" r="14" fill="#00a459"/><text x="72" y="498" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="541" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Integração</text><text x="64" y="585" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Articulação entre</text><text x="64" y="612" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">modos e serviços de</text><text x="64" y="639" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">transporte.</text><path d="M44 688h552" stroke="#c6cedc"/><text x="44" y="717" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Síntese de diretrizes legais, não participação efetiva dos modos</text><text x="44" y="741" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">de transporte em uma cidade.</text><text x="44" y="788" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Lei 12.587/2012, art. 6º, mobilidade urbana</text><text x="44" y="824" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>