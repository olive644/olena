<svg xmlns="http://www.w3.org/2000/svg" width="640" height="799" viewBox="0 0 640 799" role="img" aria-labelledby="title description"><title id="title">Educação midiática: competências para a cidadania</title><desc id="description">Educação midiática: competências para a cidadania. Leitura e participação no ambiente informacional. Referência UNESCO; consulta em 2026. Ler criticamente: Examinar credibilidade e finalidade.; Contextualizar: Relacionar informações e evidências.; Participar: Produzir e circular conteúdos com responsabilidade.. Competências organizadas editorialmente a partir da discussão da UNESCO. Não é um ranking de habilidades.</desc><rect width="640" height="799" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Educação midiática: competências</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">para a cidadania</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Leitura e participação no ambiente informacional</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Referência UNESCO; consulta em 2026</text><rect x="44" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Ler criticamente</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Examinar credibilidade</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">e finalidade.</text><rect x="330" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Contextualizar</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Relacionar informações</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">e evidências.</text><rect x="44" y="404" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="435" r="14" fill="#00a459"/><text x="72" y="441" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="484" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Participar</text><text x="64" y="528" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Produzir e circular</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">conteúdos com</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">responsabilidade.</text><path d="M44 631h552" stroke="#c6cedc"/><text x="44" y="660" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Competências organizadas editorialmente a partir da discussão da</text><text x="44" y="684" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">UNESCO. Não é um ranking de habilidades.</text><text x="44" y="731" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: UNESCO, alfabetização midiática e informacional</text><text x="44" y="767" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>