<svg xmlns="http://www.w3.org/2000/svg" width="640" height="853" viewBox="0 0 640 853" role="img" aria-labelledby="title description"><title id="title">Empreender exige condições de sustentação</title><desc id="description">Empreender exige condições de sustentação. Planejamento e acesso ao crédito. Orientação Sebrae; consulta em 2026. Planejar: Definir necessidade e finalidade dos recursos.; Organizar: Conhecer custos e fluxo do negócio.; Avaliar crédito: Relacionar financiamento e capacidade de pagamento.. Relações de planejamento e capacidade de pagamento apresentadas pelo Sebrae.</desc><rect width="640" height="853" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Empreender exige condições de</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">sustentação</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Planejamento e acesso ao crédito</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Orientação Sebrae; consulta em 2026</text><rect x="44" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Planejar</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Definir necessidade e</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">finalidade dos</text><text x="64" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">recursos.</text><rect x="330" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452