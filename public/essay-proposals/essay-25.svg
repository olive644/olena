<svg xmlns="http://www.w3.org/2000/svg" width="640" height="710" viewBox="0 0 640 710" role="img" aria-labelledby="title description"><title id="title">Onde acontece o desperdício de alimentos?</title><desc id="description">Onde acontece o desperdício de alimentos?. Distribuição mundial do desperdício no varejo e consumo. Dados de 2022; relatório de 2024. Domicílios: 60 %; Serviços de alimentação: 28 %; Varejo: 12 %. Participação no desperdício estimado, incluindo partes não comestíveis. Não é a porcentagem desperdiçada de toda a produção.</desc><rect width="640" height="710" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Onde acontece o desperdício de</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">alimentos?</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Distribuição mundial do desperdício no varejo e consumo</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Dados de 2022; relatório de 2024</text><text x="44" y="218" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">%</text><path d="M44 264v255" stroke="#e4e8f1"/><text x="44" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">0</text><path d="M154.4 264v255" stroke="#e4e8f1"/><text x="154.4" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">20</text><path d="M264.8 264v255" stroke="#e4e8f1"/><text x="264.8" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">40</text><path d="M375.2 264v255" stroke="#e4e8f1"/><text x="375.2" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">60</text><path d="M485.6 264v255" stroke="#e4e8f1"/><text x="485.6" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">80</text><path d="M596 264v255" stroke="#e4e8f1"/><text x="596" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="end">100</text><text x="44" y="288" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Domicílios</text><text x="596" y="288" font-size="25" fill="#075cf4" font-weight="700" text-anchor="end">60%</text><rect x="44" y="300" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="300" width="331.2" height="24" fill="#075cf4" rx="3"/><text x="44" y="368" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Serviços de alimentação</text><text x="596" y="368" font-size="25" fill="#e84452" font-weight="700" text-anchor="end">28%</text><rect x="44" y="380" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="380" width="154.56" height="24" fill="#e84452" rx="3"/><text x="44" y="448" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Varejo</text><text x="596" y="448" font-size="25" fill="#00a459" font-weight="700" text-anchor="end">12%</text><rect x="44" y="460" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="460" width="66.24" height="24" fill="#00a459" rx="3"/><path d="M44 542h552" stroke="#c6cedc"/><text x="44" y="571" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Participação no desperdício estimado, incluindo partes não</text><text x="44" y="595" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">comestíveis. Não é a porcentagem desperdiçada de toda a produção.</text><text x="44" y="642" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: PNUMA / WRAP, Food Waste Index Report 2024</text><text x="44" y="678" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>