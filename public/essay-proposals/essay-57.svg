<svg xmlns="http://www.w3.org/2000/svg" width="640" height="829" viewBox="0 0 640 829" role="img" aria-labelledby="title description"><title id="title">Proteção da infância: responsabilidades compartilhadas</title><desc id="description">Proteção da infância: responsabilidades compartilhadas. Rede de proteção de crianças e adolescentes. Orientação MDHC, 2026. Família e comunidade: Cuidado e atenção às necessidades.; Serviços públicos: Saúde, educação e assistência articuladas.; Órgãos de proteção: Atuação diante de ameaça ou violação de direitos.. Esquema educativo. Vulnerabilidade econômica, isoladamente, não deve ser confundida com negligência.</desc><rect width="640" height="829" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Proteção da infância:</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">responsabilidades compartilhadas</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Rede de proteção de crianças e adolescentes</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Orientação MDHC, 2026</text><rect x="44" y="218" width="266" height="194" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Família e</text><text x="64" y="328" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">comunidade</text><text x="64" y="372" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Cuidado e atenção às</text><text x="64" y="399" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">necessidades.</text><rect x="330" y="218" width="266" height="194" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Serviços públicos</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Saúde, educação e</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">assistência</text><text x="350" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">articuladas.</text><rect x="44" y="434" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="465" r="14" fill="#00a459"/><text x="72" y="471" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="514" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Órgãos de proteção</text><text x="64" y="558" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Atuação diante de</text><text x="64" y="585" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">ameaça ou violação de</text><text x="64" y="612" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">direitos.</text><path d="M44 661h552" stroke="#c6cedc"/><text x="44" y="690" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Esquema educativo. Vulnerabilidade econômica, isoladamente, não</text><text x="44" y="714" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">deve ser confundida com negligência.</text><text x="44" y="761" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: MDHC, proteção de crianças e adolescentes, 2026</text><text x="44" y="797" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>