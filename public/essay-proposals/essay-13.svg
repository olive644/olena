<svg xmlns="http://www.w3.org/2000/svg" width="640" height="657" viewBox="0 0 640 657" role="img" aria-labelledby="title description"><title id="title">A dimensão da docência na educação básica</title><desc id="description">A dimensão da docência na educação básica. Educação básica, Brasil. Censo Escolar 2023. Profissionais registrados pelo Censo Escolar: 2,4 milhões de docentes. Valor arredondado divulgado pelo MEC. Quantidade de profissionais não mede condições de trabalho.</desc><rect width="640" height="657" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">A dimensão da docência na</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">educação básica</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Educação básica, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Censo Escolar 2023</text><text x="44" y="303" font-size="88" fill="#075cf4" font-weight="700" text-anchor="start">2,4</text><text x="44" y="358" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">milhões de docentes</text><text x="44" y="394" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">Profissionais registrados pelo Censo</text><text x="44" y="426" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">Escolar</text><path d="M44 489h552" stroke="#c6cedc"/><text x="44" y="518" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Valor arredondado divulgado pelo MEC. Quantidade de profissionais</text><text x="44" y="542" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">não mede condições de trabalho.</text><text x="44" y="589" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: MEC / Inep, Censo Escolar 2023</text><text x="44" y="625" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>