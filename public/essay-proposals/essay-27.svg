<svg xmlns="http://www.w3.org/2000/svg" width="640" height="829" viewBox="0 0 640 829" role="img" aria-labelledby="title description"><title id="title">Reinserção exige uma rede de assistência</title><desc id="description">Reinserção exige uma rede de assistência. Assistência prevista na legislação brasileira. Lei de Execução Penal, arts. 10 e 11. Material e saúde: Condições básicas e cuidado.; Jurídica e educacional: Acesso a direitos e aprendizagem.; Social e religiosa: Apoio social e respeito à liberdade de crença.. O esquema agrupa as seis modalidades de assistência da lei. Não é uma taxa de reincidência.</desc><rect width="640" height="829" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Reinserção exige uma rede de</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">assistência</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Assistência prevista na legislação brasileira</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Lei de Execução Penal, arts. 10 e 11</text><rect x="44" y="218" width="266" height="194" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Material e saúde</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Condições básicas e</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">cuidado.</text><rect x="330" y="218" width="266" height="194" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Jurídica e</text><text x="350" y="328" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">educacional</text><text x="350" y="372" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Acesso a direitos e</text><text x="350" y="399" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">aprendizagem.</text><rect x="44" y="434" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="465" r="14" fill="#00a459"/><text x="72" y="471" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="514" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Social e religiosa</text><text x="64" y="558" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Apoio social e</text><text x="64" y="585" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">respeito à liberdade</text><text x="64" y="612" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">de crença.</text><path d="M44 661h552" stroke="#c6cedc"/><text x="44" y="690" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">O esquema agrupa as seis modalidades de assistência da lei. Não é</text><text x="44" y="714" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">uma taxa de reincidência.</text><text x="44" y="761" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Lei 7.210/1984, arts. 10 e 11, assistência</text><text x="44" y="797" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>