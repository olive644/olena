<svg xmlns="http://www.w3.org/2000/svg" width="640" height="979" viewBox="0 0 640 979" role="img" aria-labelledby="title description"><title id="title">Resíduos: uma ordem de prioridades</title><desc id="description">Resíduos: uma ordem de prioridades. Gestão e gerenciamento de resíduos. Lei 12.305/2010, art. 9º. Não gerar: Evitar resíduos na origem.; Reduzir: Diminuir a geração.; Reutilizar: Ampliar usos dos materiais.; Reciclar: Reintroduzir materiais em ciclos produtivos.; Tratar: Aplicar tratamento adequado aos resíduos.; Destinar rejeitos: Realizar disposição final ambientalmente adequada.. A última etapa trata de rejeitos, não de todo material que poderia ser reaproveitado.</desc><rect width="640" height="979" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Resíduos: uma ordem de</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">prioridades</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Gestão e gerenciamento de resíduos</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Lei 12.305/2010, art. 9º</text><path d="M64 243v92" stroke="#c7d1e4" stroke-width="3"/><circle cx="64" cy="223" r="20" fill="#075cf4"/><text x="64" y="230" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="102" y="230" font-size="25" fill="#10234c" font-weight="700" text-anchor="start">Não gerar</text><text x="102" y="264" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Evitar resíduos na origem.</text><path d="M64 335v92" stroke="#c7d1e4" stroke-width="3"/><circle cx="64" cy="315" r="20" fill="#e84452"/><text x="64" y="322" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="102" y="322" font-size="25" fill="#10234c" font-weight="700" text-anchor="start">Reduzir</text><text x="102" y="356" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Diminuir a geração.</text><path d="M64 427v92" stroke="#c7d1e4" stroke-width="3"/><circle cx="64" cy="407" r="20" fill="#00a459"/><text x="64" y="414" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="102" y="414" font-size="25" fill="#10234c" font-weight="700" text-anchor="start">Reutilizar</text><text x="102" y="448" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Ampliar usos dos materiais.</text><path d="M64 519v92" stroke="#c7d1e4" stroke-width="3"/><circle cx="64" cy="499" r="20" fill="#d98b00"/><text x="64" y="506" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="102" y="506" font-size="25" fill="#10234c" font-weight="700" text-anchor="start">Reciclar</text><text x="102" y="540" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Reintroduzir materiais em ciclos produtivos.</text><path d="M64 611v92" stroke="#c7d1e4" stroke-width="3"/><circle cx="64" cy="591" r="20" fill="#7b48bd"/><text x="64" y="598" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="102" y="598" font-size="25" fill="#10234c" font-weight="700" text-anchor="start">Tratar</text><text x="102" y="632" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Aplicar tratamento adequado aos resíduos.</text><circle cx="64" cy="683" r="20" fill="#007c91"/><text x="64" y="690" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="102" y="690" font-size="25" fill="#10234c" font-weight="700" text-anchor="start">Destinar rejeitos</text><text x="102" y="724" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Realizar disposição final ambientalmente</text><text x="102" y="751" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">adequada.</text><path d="M44 811h552" stroke="#c6cedc"/><text x="44" y="840" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">A última etapa trata de rejeitos, não de todo material que</text><text x="44" y="864" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">poderia ser reaproveitado.</text><text x="44" y="911" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Lei 12.305/2010, art. 9º, Política de Resíduos Sólidos</text><text x="44" y="947" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>