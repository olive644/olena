<svg xmlns="http://www.w3.org/2000/svg" width="640" height="856" viewBox="0 0 640 856" role="img" aria-labelledby="title description"><title id="title">Dados pessoais: conhecer para decidir</title><desc id="description">Dados pessoais: conhecer para decidir. Brasil, direitos dos titulares. Direitos previstos na LGPD; consulta em 2026. Confirmação e acesso: Saber se há tratamento e acessar os próprios dados.; Correção: Solicitar atualização de informações inadequadas.; Controle: Exercer os direitos cabíveis perante o controlador.. Síntese educativa. Cada direito possui hipóteses e condições de exercício.</desc><rect width="640" height="856" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Dados pessoais: conhecer para</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">decidir</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Brasil, direitos dos titulares</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Direitos previstos na LGPD; consulta em 2026</text><rect x="44" y="218" width="266" height="221" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Confirmação e</text><text x="64" y="328" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">acesso</text><text x="64" y="372" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Saber se há tratamento</text><text x="64" y="399" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">e acessar os próprios</text><text x="64" y="426" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">dados.</text><rect x="330" y="218" width="266" height="221" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Correção</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Solicitar atualização</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">de informações</text><text x="350" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">inadequadas.</text><rect x="44" y="461" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="492" r="14" fill="#00a459"/><text x="72" y="498" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="541" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Controle</text><text x="64" y="585" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Exercer os direitos</text><text x="64" y="612" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">cabíveis perante o</text><text x="64" y="639" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">controlador.</text><path d="M44 688h552" stroke="#c6cedc"/><text x="44" y="717" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Síntese educativa. Cada direito possui hipóteses e condições de</text><text x="44" y="741" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">exercício.</text><text x="44" y="788" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: ANPD, direitos dos titulares de dados</text><text x="44" y="824" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>