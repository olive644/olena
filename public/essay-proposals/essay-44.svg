<svg xmlns="http://www.w3.org/2000/svg" width="640" height="799" viewBox="0 0 640 799" role="img" aria-labelledby="title description"><title id="title">Patrimônio: cultura que vive nas pessoas</title><desc id="description">Patrimônio: cultura que vive nas pessoas. Exemplos de dimensões do patrimônio imaterial. Referência Iphan; consulta em 2026. Saberes e ofícios: Conhecimentos e modos de fazer.; Celebrações: Práticas coletivas e festas.; Expressões: Música, dança, teatro e outras manifestações.. Exemplos do patrimônio imaterial. O patrimônio cultural também possui dimensões materiais.</desc><rect width="640" height="799" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Patrimônio: cultura que vive nas</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">pessoas</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Exemplos de dimensões do patrimônio imaterial</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Referência Iphan; consulta em 2026</text><rect x="44" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Saberes e ofícios</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Conhecimentos e modos</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">de fazer.</text><rect x="330" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Celebrações</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Práticas coletivas e</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">festas.</text><rect x="44" y="404" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="435" r="14" fill="#00a459"/><text x="72" y="441" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="484" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Expressões</text><text x="64" y="528" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Música, dança, teatro</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">e outras</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">manifestações.</text><path d="M44 631h552" stroke="#c6cedc"/><text x="44" y="660" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Exemplos do patrimônio imaterial. O patrimônio cultural também</text><text x="44" y="684" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">possui dimensões materiais.</text><text x="44" y="731" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Iphan, patrimônio cultural imaterial</text><text x="44" y="767" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>