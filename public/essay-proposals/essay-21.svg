<svg xmlns="http://www.w3.org/2000/svg" width="640" height="985" viewBox="0 0 640 985" role="img" aria-labelledby="title description"><title id="title">Desastres: agir antes, durante e depois</title><desc id="description">Desastres: agir antes, durante e depois. Eixos da Proteção e Defesa Civil. Plano Nacional 2025 a 2035. Prevenção: Evitar a formação de riscos.; Mitigação: Diminuir riscos e impactos.; Preparação: Organizar capacidades e respostas.; Resposta: Atuar durante a emergência.; Recuperação: Restabelecer condições e reduzir novas vulnerabilidades.. Os eixos se articulam. A sequência não significa que cada ação só possa ocorrer isoladamente.</desc><rect width="640" height="985" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Desastres: agir antes, durante e</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">depois</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Eixos da Proteção e Defesa Civil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Plano Nacional 2025 a 2035</text><rect x="44" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Prevenção</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Evitar a formação de</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">riscos.</text><rect x="330" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Mitigação</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Diminuir riscos e</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">impactos.</text><rect x="44" y="404" width="266" height="164" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="435" r="14" fill="#00a459"/><text x="72" y="441" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="484" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Preparação</text><text x="64" y="528" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Organizar capacidades</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">e respostas.</text><rect x="330" y="404" width="266" height="164" rx="9" fill="#fff" stroke="#d98b00" stroke-width="2"/><circle cx="358" cy="435" r="14" fill="#d98b00"/><text x="358" y="441" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">D</text><text x="350" y="484" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Resposta</text><text x="350" y="528" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Atuar durante a</text><text x="350" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">emergência.</text><rect x="44" y="590" width="266" height="191" rx="9" fill="#fff" stroke="#7b48bd" stroke-width="2"/><circle cx="72" cy="621" r="14" fill="#7b48bd"/><text x="72" y="627" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">E</text><text x="64" y="670" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Recuperação</text><text x="64" y="714" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Restabelecer condições</text><text x="64" y="741" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">e reduzir novas</text><text x="64" y="768" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">vulnerabilidades.</text><path d="M44 817h552" stroke="#c6cedc"/><text x="44" y="846" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Os eixos se articulam. A sequência não significa que cada ação só</text><text x="44" y="870" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">possa ocorrer isoladamente.</text><text x="44" y="917" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: MIDR, Plano Nacional de Proteção e Defesa Civil</text><text x="44" y="953" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>