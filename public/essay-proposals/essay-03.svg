<svg xmlns="http://www.w3.org/2000/svg" width="640" height="826" viewBox="0 0 640 826" role="img" aria-labelledby="title description"><title id="title">Antes de compartilhar, investigar</title><desc id="description">Antes de compartilhar, investigar. Leitura crítica da informação. Referência UNESCO; consulta em 2026. Origem: Quem publicou e com qual finalidade?; Evidências: O que sustenta a informação apresentada?; Confronto: Outras fontes confiáveis confirmam o conteúdo?. As etapas são uma síntese de práticas de verificação, não uma garantia automática de veracidade.</desc><rect width="640" height="826" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Antes de compartilhar,</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">investigar</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Leitura crítica da informação</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Referência UNESCO; consulta em 2026</text><rect x="44" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Origem</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Quem publicou e com</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">qual finalidade?</text><rect x="330" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Evidências</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">O que sustenta a</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">informação</text><text x="350" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">apresentada?</text><rect x="44" y="431" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="462" r="14" fill="#00a459"/><text x="72" y="468" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="511" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Confronto</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Outras fontes</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">confiáveis confirmam o</text><text x="64" y="609" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">conteúdo?</text><path d="M44 658h552" stroke="#c6cedc"/><text x="44" y="687" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">As etapas são uma síntese de práticas de verificação, não uma</text><text x="44" y="711" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">garantia automática de veracidade.</text><text x="44" y="758" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: UNESCO, alfabetização midiática e informacional</text><text x="44" y="794" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>