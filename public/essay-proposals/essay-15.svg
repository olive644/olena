<svg xmlns="http://www.w3.org/2000/svg" width="640" height="856" viewBox="0 0 640 856" role="img" aria-labelledby="title description"><title id="title">Acesso à cultura envolve mais de uma etapa</title><desc id="description">Acesso à cultura envolve mais de uma etapa. Direitos culturais e difusão. Referência institucional; consulta em 2026. Obras e expressões: Reconhecer a diversidade da produção cultural.; Circulação: Criar condições para que a produção alcance o público.; Formação de público: Promover experiências de fruição e participação.. Esquema explicativo baseado na política de difusão; não representa dados de municípios.</desc><rect width="640" height="856" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Acesso à cultura envolve mais de</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">uma etapa</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Direitos culturais e difusão</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Referência institucional; consulta em 2026</text><rect x="44" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Obras e expressões</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Reconhecer a</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">diversidade da</text><text x="64" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">produção cultural.</text><rect x="330" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Circulação</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Criar condições para</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">que a produção alcance</text><text x="350" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">o público.</text><rect x="44" y="431" width="266" height="221" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="462" r="14" fill="#00a459"/><text x="72" y="468" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="511" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Formação de</text><text x="64" y="541" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">público</text><text x="64" y="585" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Promover experiências</text><text x="64" y="612" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">de fruição e</text><text x="64" y="639" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">participação.</text><path d="M44 688h552" stroke="#c6cedc"/><text x="44" y="717" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Esquema explicativo baseado na política de difusão; não</text><text x="44" y="741" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">representa dados de municípios.</text><text x="44" y="788" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Ministério da Cultura, difusão audiovisual</text><text x="44" y="824" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>