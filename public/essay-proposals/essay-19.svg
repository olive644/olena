<svg xmlns="http://www.w3.org/2000/svg" width="640" height="625" viewBox="0 0 640 625" role="img" aria-labelledby="title description"><title id="title">Trabalho infantil: dimensão de uma violação</title><desc id="description">Trabalho infantil: dimensão de uma violação. Pessoas de 5 a 17 anos, Brasil. 2022. Em situação de trabalho infantil: 1,9 milhão de pessoas. Valor arredondado. Estatística experimental da PNAD, conforme a divulgação original.</desc><rect width="640" height="625" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Trabalho infantil: dimensão de</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">uma violação</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Pessoas de 5 a 17 anos, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">2022</text><text x="44" y="303" font-size="88" fill="#075cf4" font-weight="700" text-anchor="start">1,9</text><text x="44" y="358" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">milhão de pessoas</text><text x="44" y="394" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">Em situação de trabalho infantil</text><path d="M44 457h552" stroke="#c6cedc"/><text x="44" y="486" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Valor arredondado. Estatística experimental da PNAD, conforme a</text><text x="44" y="510" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">divulgação original.</text><text x="44" y="557" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: IBGE, trabalho de crianças e adolescentes, 2022</text><text x="44" y="593" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>