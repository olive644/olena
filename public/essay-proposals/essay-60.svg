<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" role="img" aria-labelledby="title description"><title id="title">Intolerância religiosa: o que as denúncias registram</title><desc id="description">Intolerância religiosa: o que as denúncias registram. Denúncias ao Disque 100, Brasil. 2023 e 2024. 2023: 1.481 denúncias; 2024: 2.472 denúncias. Registros de denúncias, não contagem de todas as ocorrências. O aumento pode refletir também mudanças no acesso ao canal.</desc><rect width="640" height="630" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Intolerância religiosa: o que as</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">denúncias registram</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Denúncias ao Disque 100, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">2023 e 2024</text><text x="44" y="218" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">denúncias</text><path d="M44 264v166" stroke="#e4e8f1"/><text x="44" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">0</text><path d="M154.4 264v166" stroke="#e4e8f1"/><text x="154.4" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">500</text><path d="M264.8 264v166" stroke="#e4e8f1"/><text x="264.8" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">1.000</text><path d="M375.2 264v166" stroke="#e4e8f1"/><text x="375.2" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">1.500</text><path d="M485.6 264v166" stroke="#e4e8f1"/><text x="485.6" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">2.000</text><path d="M596 264v166" stroke="#e4e8f1"/><text x="596" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="end">2.500</text><text x="44" y="288" font-size="21" fill="#152644" font-weight="600" text-anchor="start">2023</text><text x="596" y="288" font-size="25" fill="#075cf4" font-weight="700" text-anchor="end">1.481</text><rect x="44" y="300" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="300" width="327.0048" height="24" fill="#075cf4" rx="3"/><text x="44" y="368" font-size="21" fill="#152644" font-weight="600" text-anchor="start">2024</text><text x="596" y="368" font-size="25" fill="#e84452" font-weight="700" text-anchor="end">2.472</text><rect x="44" y="380" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="380" width="545.8176" height="24" fill="#e84452" rx="3"/><path d="M44 462h552" stroke="#c6cedc"/><text x="44" y="491" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Registros de denúncias, não contagem de todas as ocorrências. O</text><text x="44" y="515" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">aumento pode refletir também mudanças no acesso ao canal.</text><text x="44" y="562" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: MDHC / Disque 100, divulgação Agência Brasil, 2025</text><text x="44" y="598" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>