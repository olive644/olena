<svg xmlns="http://www.w3.org/2000/svg" width="640" height="856" viewBox="0 0 640 856" role="img" aria-labelledby="title description"><title id="title">Vida estudantil: apoio também faz parte da escola</title><desc id="description">Vida estudantil: apoio também faz parte da escola. Promoção e proteção da saúde mental. Referência OMS, 2025. Ambiente acolhedor: Reduzir violência, discriminação e isolamento.; Habilidades sociais: Fortalecer vínculos e formas de lidar com desafios.; Acesso ao apoio: Criar possibilidades de acolhimento e encaminhamento.. Dimensões de proteção destacadas pela OMS. O esquema não apresenta taxas de esgotamento entre estudantes.</desc><rect width="640" height="856" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Vida estudantil: apoio também</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">faz parte da escola</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Promoção e proteção da saúde mental</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Referência OMS, 2025</text><rect x="44" y="218" width="266" height="221" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Ambiente acolhedor</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Reduzir violência,</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">discriminação e</text><text x="64" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">isolamento.</text><rect x="330" y="218" width="266" height="221" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Habilidades</text><text x="350" y="328" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">sociais</text><text x="350" y="372" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Fortalecer vínculos e</text><text x="350" y="399" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">formas de lidar com</text><text x="350" y="426" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">desafios.</text><rect x="44" y="461" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="492" r="14" fill="#00a459"/><text x="72" y="498" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="541" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Acesso ao apoio</text><text x="64" y="585" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Criar possibilidades</text><text x="64" y="612" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">de acolhimento e</text><text x="64" y="639" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">encaminhamento.</text><path d="M44 688h552" stroke="#c6cedc"/><text x="44" y="717" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Dimensões de proteção destacadas pela OMS. O esquema não</text><text x="44" y="741" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">apresenta taxas de esgotamento entre estudantes.</text><text x="44" y="788" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: OMS, saúde mental de adolescentes, 2025</text><text x="44" y="824" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>