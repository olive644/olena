<svg xmlns="http://www.w3.org/2000/svg" width="640" height="775" viewBox="0 0 640 775" role="img" aria-labelledby="title description"><title id="title">IA na educação: a decisão continua humana</title><desc id="description">IA na educação: a decisão continua humana. Síntese de princípios, não estatística. Orientação publicada em 2023. Mediação docente: Definir objetivos de aprendizagem e acompanhar o uso.; Proteção de dados: Considerar privacidade e riscos de exposição.; Análise crítica: Verificar resultados e preservar a autonomia.. Esquema editorial adaptado das orientações da UNESCO.</desc><rect width="640" height="775" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">IA na educação: a decisão</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">continua humana</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Síntese de princípios, não estatística</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Orientação publicada em 2023</text><rect x="44" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Mediação docente</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Definir objetivos de</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">aprendizagem e</text><text x="64" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">acompanhar o uso.</text><rect x="330" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Proteção de dados</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Considerar privacidade</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">e riscos de exposição.</text><rect x="44" y="431" width="266" height="164" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="462" r="14" fill="#00a459"/><text x="72" y="468" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="511" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Análise crítica</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Verificar resultados e</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">preservar a autonomia.</text><path d="M44 631h552" stroke="#c6cedc"/><text x="44" y="660" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Esquema editorial adaptado das orientações da UNESCO.</text><text x="44" y="707" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: UNESCO, orientação sobre IA generativa, 2023</text><text x="44" y="743" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>