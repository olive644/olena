<svg xmlns="http://www.w3.org/2000/svg" width="640" height="625" viewBox="0 0 640 625" role="img" aria-labelledby="title description"><title id="title">Deficiência e equidade no cuidado</title><desc id="description">Deficiência e equidade no cuidado. População mundial com deficiência significativa. Estimativa publicada pela OMS em 2023. Pessoas com deficiência significativa: 1,3 bilhão de pessoas. Estimativa mundial. Definição e abrangência não são idênticas às de todas as pesquisas brasileiras.</desc><rect width="640" height="625" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Deficiência e equidade no</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">cuidado</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">População mundial com deficiência significativa</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Estimativa publicada pela OMS em 2023</text><text x="44" y="303" font-size="88" fill="#075cf4" font-weight="700" text-anchor="start">1,3</text><text x="44" y="358" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">bilhão de pessoas</text><text x="44" y="394" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">Pessoas com deficiência significativa</text><path d="M44 457h552" stroke="#c6cedc"/><text x="44" y="486" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Estimativa mundial. Definição e abrangência não são idênticas às</text><text x="44" y="510" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">de todas as pesquisas brasileiras.</text><text x="44" y="557" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: OMS, deficiência e saúde, 2023</text><text x="44" y="593" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>