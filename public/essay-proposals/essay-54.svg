<svg xmlns="http://www.w3.org/2000/svg" width="640" height="799" viewBox="0 0 640 799" role="img" aria-labelledby="title description"><title id="title">Território, cultura e proteção dos biomas</title><desc id="description">Território, cultura e proteção dos biomas. Direitos dos povos indígenas e seus territórios. Referência Funai; consulta em 2026. Território: Condições para reprodução física e cultural.; Autonomia: Respeito às formas próprias de organização.; Participação: Protagonismo na gestão e preservação.. Esquema sobre terras indígenas. Outras comunidades tradicionais possuem contextos e instrumentos próprios de proteção.</desc><rect width="640" height="799" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Território, cultura e proteção</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">dos biomas</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Direitos dos povos indígenas e seus territórios</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Referência Funai; consulta em 2026</text><rect x="44" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Território</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Condições para</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">reprodução física e</text><text x="64" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">cultural.</text><rect x="330" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Autonomia</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Respeito às formas</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">próprias de</text><text x="350" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">organização.</text><rect x="44" y="431" width="266" height="164" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="462" r="14" fill="#00a459"/><text x="72" y="468" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="511" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Participação</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Protagonismo na gestão</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">e preservação.</text><path d="M44 631h552" stroke="#c6cedc"/><text x="44" y="660" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Esquema sobre terras indígenas. Outras comunidades tradicionais</text><text x="44" y="684" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">possuem contextos e instrumentos próprios de proteção.</text><text x="44" y="731" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Funai, territórios e direitos indígenas</text><text x="44" y="767" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>