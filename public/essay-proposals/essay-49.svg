<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" role="img" aria-labelledby="title description"><title id="title">O cuidado tem uma distribuição desigual</title><desc id="description">O cuidado tem uma distribuição desigual. Pessoas de 14 anos ou mais que realizaram as atividades. 2022. Mulheres: 21,3 horas por semana; Homens: 11,7 horas por semana. Média de horas em afazeres domésticos e/ou cuidado de pessoas, Brasil. Não é jornada de emprego doméstico remunerado.</desc><rect width="640" height="630" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">O cuidado tem uma distribuição</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">desigual</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Pessoas de 14 anos ou mais que realizaram as atividades</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">2022</text><text x="44" y="218" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">horas por semana</text><path d="M44 264v166" stroke="#e4e8f1"/><text x="44" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">0</text><path d="M154.4 264v166" stroke="#e4e8f1"/><text x="154.4" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">5</text><path d="M264.8 264v166" stroke="#e4e8f1"/><text x="264.8" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">10</text><path d="M375.2 264v166" stroke="#e4e8f1"/><text x="375.2" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">15</text><path d="M485.6 264v166" stroke="#e4e8f1"/><text x="485.6" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">20</text><path d="M596 264v166" stroke="#e4e8f1"/><text x="596" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="end">25</text><text x="44" y="288" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Mulheres</text><text x="596" y="288" font-size="25" fill="#075cf4" font-weight="700" text-anchor="end">21,3</text><rect x="44" y="300" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="300" width="470.30400000000003" height="24" fill="#075cf4" rx="3"/><text x="44" y="368" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Homens</text><text x="596" y="368" font-size="25" fill="#e84452" font-weight="700" text-anchor="end">11,7</text><rect x="44" y="380" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="380" width="258.336" height="24" fill="#e84452" rx="3"/><path d="M44 462h552" stroke="#c6cedc"/><text x="44" y="491" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Média de horas em afazeres domésticos e/ou cuidado de pessoas,</text><text x="44" y="515" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Brasil. Não é jornada de emprego doméstico remunerado.</text><text x="44" y="562" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: IBGE, Outras formas de trabalho 2022, divulgação EBC</text><text x="44" y="598" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>