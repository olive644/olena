<svg xmlns="http://www.w3.org/2000/svg" width="640" height="657" viewBox="0 0 640 657" role="img" aria-labelledby="title description"><title id="title">População em situação de rua: uma estimativa</title><desc id="description">População em situação de rua: uma estimativa. Estimativa nacional, Brasil. 2022. Pessoas em situação de rua estimadas pelo Ipea: 281,4 mil pessoas. Valor arredondado. Estimativa modelada, não contagem censitária; não confundir com registros do Cadastro Único.</desc><rect width="640" height="657" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">População em situação de rua:</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">uma estimativa</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Estimativa nacional, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">2022</text><text x="44" y="303" font-size="88" fill="#075cf4" font-weight="700" text-anchor="start">281,4</text><text x="44" y="358" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">mil pessoas</text><text x="44" y="394" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">Pessoas em situação de rua estimadas</text><text x="44" y="426" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">pelo Ipea</text><path d="M44 489h552" stroke="#c6cedc"/><text x="44" y="518" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Valor arredondado. Estimativa modelada, não contagem censitária;</text><text x="44" y="542" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">não confundir com registros do Cadastro Único.</text><text x="44" y="589" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Ipea, estimativa da população em situação de rua, 2022</text><text x="44" y="625" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>