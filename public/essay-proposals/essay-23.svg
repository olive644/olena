<svg xmlns="http://www.w3.org/2000/svg" width="640" height="658" viewBox="0 0 640 658" role="img" aria-labelledby="title description"><title id="title">Saneamento: serviços que não chegam por igual</title><desc id="description">Saneamento: serviços que não chegam por igual. Moradores de domicílios particulares permanentes, Brasil. Censo 2022. Rede geral de abastecimento de água: 82,9 %; Rede coletora de esgoto ou fossa ligada à rede: 62,5 %. Indicadores de serviços diferentes. Não somar os percentuais nem tratar acesso à rede como garantia de qualidade.</desc><rect width="640" height="658" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Saneamento: serviços que não</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">chegam por igual</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Moradores de domicílios particulares permanentes, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Censo 2022</text><text x="44" y="218" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">%</text><path d="M44 264v166" stroke="#e4e8f1"/><text x="44" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">0</text><path d="M154.4 264v166" stroke="#e4e8f1"/><text x="154.4" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">20</text><path d="M264.8 264v166" stroke="#e4e8f1"/><text x="264.8" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">40</text><path d="M375.2 264v166" stroke="#e4e8f1"/><text x="375.2" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">60</text><path d="M485.6 264v166" stroke="#e4e8f1"/><text x="485.6" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">80</text><path d="M596 264v166" stroke="#e4e8f1"/><text x="596" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="end">100</text><text x="44" y="288" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Rede geral de abastecimento de água</text><text x="596" y="288" font-size="25" fill="#075cf4" font-weight="700" text-anchor="end">82,9%</text><rect x="44" y="300" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="300" width="457.608" height="24" fill="#075cf4" rx="3"/><text x="44" y="368" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Rede coletora de esgoto ou fossa ligada à</text><text x="44" y="396" font-size="21" fill="#152644" font-weight="600" text-anchor="start">rede</text><text x="596" y="368" font-size="25" fill="#e84452" font-weight="700" text-anchor="end">62,5%</text><rect x="44" y="408" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="408" width="345" height="24" fill="#e84452" rx="3"/><path d="M44 490h552" stroke="#c6cedc"/><text x="44" y="519" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Indicadores de serviços diferentes. Não somar os percentuais nem</text><text x="44" y="543" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">tratar acesso à rede como garantia de qualidade.</text><text x="44" y="590" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: IBGE, Censo Demográfico 2022, domicílios</text><text x="44" y="626" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>