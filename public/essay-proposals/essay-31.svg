<svg xmlns="http://www.w3.org/2000/svg" width="640" height="826" viewBox="0 0 640 826" role="img" aria-labelledby="title description"><title id="title">Quatro princípios para serviços digitais acessíveis</title><desc id="description">Quatro princípios para serviços digitais acessíveis. Acessibilidade de conteúdo e interfaces. Princípios W3C / WAI; consulta em 2026. Perceptível: Informação apresentada de modos que possam ser percebidos.; Operável: Possibilidade de usar os controles e navegar.; Compreensível: Informações e funcionamento que façam sentido.; Robusto: Conteúdo compatível com diferentes tecnologias.. Princípios para orientar o acesso a conteúdos e serviços digitais.</desc><rect width="640" height="826" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Quatro princípios para serviços</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">digitais acessíveis</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Acessibilidade de conteúdo e interfaces</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Princípios W3C / WAI; consulta em 2026</text><rect x="44" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Perceptível</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Informação apresentada</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">de modos que possam</text><text x="64" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">ser percebidos.</text><rect x="330" y="