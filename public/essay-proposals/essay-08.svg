<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title description"><title id="title">Saúde mental na adolescência</title><desc id="description">Saúde mental na adolescência. Estimativa mundial, pessoas de 10 a 19 anos. Ficha informativa de 2025. Adolescentes com condições de saúde mental: 14,3 %. Estimativa global da OMS. Não é uma taxa específica de estudantes brasileiros.</desc><rect width="640" height="580" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Saúde mental na adolescência</text><text x="44" y="104" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Estimativa mundial, pessoas de 10 a 19 anos</text><text x="44" y="128" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Ficha informativa de 2025</text><text x="44" y="262" font-size="88" fill="#075cf4" font-weight="700" text-anchor="start">14,3%</text><text x="44" y="317" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">Adolescentes com condições de saúde</text><text x="44" y="349" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">mental</text><path d="M44 412h552" stroke="#c6cedc"/><text x="44" y="441" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Estimativa global da OMS. Não é uma taxa específica de estudantes</text><text x="44" y="465" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">brasileiros.</text><text x="44" y="512" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: OMS, saúde mental de adolescentes, 2025</text><text x="44" y="548" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>