<svg xmlns="http://www.w3.org/2000/svg" width="640" height="799" viewBox="0 0 640 799" role="img" aria-labelledby="title description"><title id="title">Jornada: duração e organização importam</title><desc id="description">Jornada: duração e organização importam. Tempo de trabalho, perspectiva internacional. Relatório de 2022. Duração: Quantidade de horas dedicadas ao trabalho.; Horários: Como as horas se distribuem na rotina.; Conciliação: Relação entre trabalho, descanso e vida pessoal.. Dimensões analisadas pela OIT. Não estabelece um limite legal único para todos os regimes de trabalho.</desc><rect width="640" height="799" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Jornada: duração e organização</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">importam</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Tempo de trabalho, perspectiva internacional</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Relatório de 2022</text><rect x="44" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Duração</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Quantidade de horas</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">dedicadas ao trabalho.</text><rect x="330" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Horários</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Como as horas se</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">distribuem na rotina.</text><rect x="44" y="404" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="435" r="14" fill="#00a459"/><text x="72" y="441" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="484" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Conciliação</text><text x="64" y="528" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Relação entre</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">trabalho, descanso e</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">vida pessoal.</text><path d="M44 631h552" stroke="#c6cedc"/><text x="44" y="660" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Dimensões analisadas pela OIT. Não estabelece um limite legal</text><text x="44" y="684" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">único para todos os regimes de trabalho.</text><text x="44" y="731" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: OIT, Working Time and Work-Life Balance, 2022</text><text x="44" y="767" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>