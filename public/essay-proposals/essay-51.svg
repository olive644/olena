<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" role="img" aria-labelledby="title description"><title id="title">Água: rede de distribuição e acesso dentro de casa</title><desc id="description">Água: rede de distribuição e acesso dentro de casa. Moradores de domicílios particulares permanentes, Brasil. Censo 2022. Rede geral como principal abastecimento: 82,9 %; Água encanada dentro da residência: 95,1 %. São indicadores diferentes; água encanada pode vir de outras fontes. Não somar nem concluir sobre potabilidade.</desc><rect width="640" height="630" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Água: rede de distribuição e</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">acesso dentro de casa</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Moradores de domicílios particulares permanentes, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Censo 2022</text><text x="44" y="218" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">%</text><path d="M44 264v166" stroke="#e4e8f1"/><text x="44" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">0</text><path d="M154.4 264v166" stroke="#e4e8f1"/><text x="154.4" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">20</text><path d="M264.8 264v166" stroke="#e4e8f1"/><text x="264.8" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">40</text><path d="M375.2 264v166" stroke="#e4e8f1"/><text x="375.2" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">60</text><path d="M485.6 264v166" stroke="#e4e8f1"/><text x="485.6" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">80</text><path d="M596 264v166" stroke="#e4e8f1"/><text x="596" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="end">100</text><text x="44" y="288" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Rede geral como principal abastecimento</text><text x="596" y="288" font-size="25" fill="#075cf4" font-weight="700" text-anchor="end">82,9%</text><rect x="44" y="300" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="300" width="457.608" height="24" fill="#075cf4" rx="3"/><text x="44" y="368" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Água encanada dentro da residência</text><text x="596" y="368" font-size="25" fill="#e84452" font-weight="700" text-anchor="end">95,1%</text><rect x="44" y="380" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="380" width="524.952" height="24" fill="#e84452" rx="3"/><path d="M44 462h552" stroke="#c6cedc"/><text x="44" y="491" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">São indicadores diferentes; água encanada pode vir de outras</text><text x="44" y="515" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">fontes. Não somar nem concluir sobre potabilidade.</text><text x="44" y="562" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: IBGE, Censo Demográfico 2022, domicílios</text><text x="44" y="598" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>