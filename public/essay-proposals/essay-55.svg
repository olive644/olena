<svg xmlns="http://www.w3.org/2000/svg" width="640" height="790" viewBox="0 0 640 790" role="img" aria-labelledby="title description"><title id="title">Vestuário: impactos ao longo do ciclo de vida</title><desc id="description">Vestuário: impactos ao longo do ciclo de vida. Participação no impacto climático dos têxteis, contexto europeu. Estudos de 2020/2021 sintetizados pela AEA. Produção: 80 %; Distribuição e varejo: 3 %; Uso: 14 %; Fim de vida: 3 %. Estimativas aproximadas para o contexto europeu. Não representam diretamente a cadeia brasileira de vestuário.</desc><rect width="640" height="790" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Vestuário: impactos ao longo do</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">ciclo de vida</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Participação no impacto climático dos têxteis, contexto europeu</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Estudos de 2020/2021 sintetizados pela AEA</text><text x="44" y="218" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">%</text><path d="M44 264v344" stroke="#e4e8f1"/><text x="44" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">0</text><path d="M154.4 264v344" stroke="#e4e8f1"/><text x="154.4" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">20</text><path d="M264.8 264v344" stroke="#e4e8f1"/><text x="264.8" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">40</text><path d="M375.2 264v344" stroke="#e4e8f1"/><text x="375.2" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">60</text><path d="M485.6 264v344" stroke="#e4e8f1"/><text x="485.6" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">80</text><path d="M596 264v344" stroke="#e4e8f1"/><text x="596" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="end">100</text><text x="44" y="288" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Produção</text><text x="596" y="288" font-size="25" fill="#075cf4" font-weight="700" text-anchor="end">80%</text><rect x="44" y="300" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="300" width="441.6" height="24" fill="#075cf4" rx="3"/><text x="44" y="368" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Distribuição e varejo</text><text x="596" y="368" font-size="25" fill="#e84452" font-weight="700" text-anchor="end">3%</text><rect x="44" y="380" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="380" width="16.56" height="24" fill="#e84452" rx="3"/><text x="44" y="448" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Uso</text><text x="596" y="448" font-size="25" fill="#00a459" font-weight="700" text-anchor="end">14%</text><rect x="44" y="460" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="460" width="77.28" height="24" fill="#00a459" rx="3"/><text x="44" y="528" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Fim de vida</text><text x="596" y="528" font-size="25" fill="#d98b00" font-weight="700" text-anchor="end">3%</text><rect x="44" y="540" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="540" width="16.56" height="24" fill="#d98b00" rx="3"/><path d="M44 622h552" stroke="#c6cedc"/><text x="44" y="651" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Estimativas aproximadas para o contexto europeu. Não representam</text><text x="44" y="675" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">diretamente a cadeia brasileira de vestuário.</text><text x="44" y="722" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Agência Europeia do Ambiente, ciclo de vida têxtil</text><text x="44" y="758" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>