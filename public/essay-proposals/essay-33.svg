<svg xmlns="http://www.w3.org/2000/svg" width="640" height="826" viewBox="0 0 640 826" role="img" aria-labelledby="title description"><title id="title">Quando uma decisão é automatizada</title><desc id="description">Quando uma decisão é automatizada. Decisões baseadas em dados pessoais. Direitos na LGPD; consulta em 2026. Efeito: Uma decisão pode afetar interesses do titular.; Revisão: O titular pode solicitar a revisão nas hipóteses legais.; Critérios: Transparência sobre parâmetros e critérios utilizados.. O esquema não afirma que todo sistema de recomendação se enquadra na mesma hipótese legal.</desc><rect width="640" height="826" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Quando uma decisão é</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">automatizada</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Decisões baseadas em dados pessoais</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Direitos na LGPD; consulta em 2026</text><rect x="44" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Efeito</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Uma decisão pode</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">afetar interesses do</text><text x="64" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">titular.</text><rect x="330" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Revisão</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">O titular pode</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">solicitar a revisão</text><text x="350" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">nas hipóteses legais.</text><rect x="44" y="431" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="462" r="14" fill="#00a459"/><text x="72" y="468" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="511" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Critérios</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Transparência sobre</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">parâmetros e critérios</text><text x="64" y="609" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">utilizados.</text><path d="M44 658h552" stroke="#c6cedc"/><text x="44" y="687" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">O esquema não afirma que todo sistema de recomendação se enquadra</text><text x="44" y="711" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">na mesma hipótese legal.</text><text x="44" y="758" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: ANPD, direitos dos titulares de dados</text><text x="44" y="794" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>