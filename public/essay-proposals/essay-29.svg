<svg xmlns="http://www.w3.org/2000/svg" width="640" height="802" viewBox="0 0 640 802" role="img" aria-labelledby="title description"><title id="title">Bullying: reconhecer a intimidação sistemática</title><desc id="description">Bullying: reconhecer a intimidação sistemática. Elementos da definição legal. Lei 13.185/2015. Intencionalidade: Ação orientada a intimidar ou agredir.; Repetição: Prática persistente de violência.; Desequilíbrio de poder: Relação desigual entre as partes.. Elementos da definição de intimidação sistemática apresentada na Lei 13.185/2015.</desc><rect width="640" height="802" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Bullying: reconhecer a</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">intimidação sistemática</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Elementos da definição legal</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Lei 13.185/2015</text><rect x="44" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Intencionalidade</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Ação orientada a</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">intimidar ou agredir.</text><rect x="330" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Repetição</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Prática persistente de</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">violência.</text><rect x="44" y="404" width="266" height="194" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="435" r="14" fill="#00a459"/><text x="72" y="441" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="484" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Desequilíbrio de</text><text x="64" y="514" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">poder</text><text x="64" y="558" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Relação desigual entre</text><text x="64" y="585" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">as partes.</text><path d="M44 634h552" stroke="#c6cedc"/><text x="44" y="663" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Elementos da definição de intimidação sistemática apresentada na</text><text x="44" y="687" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Lei 13.185/2015.</text><text x="44" y="734" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Lei 13.185/2015, prevenção à intimidação sistemática</text><text x="44" y="770" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>