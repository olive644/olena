<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" role="img" aria-labelledby="title description"><title id="title">Aprendizagem digital começa por infraestrutura</title><desc id="description">Aprendizagem digital começa por infraestrutura. Domicílios particulares permanentes, Brasil. 2024. Com utilização de internet: 93,6 %; Sem utilização de internet: 6,4 %. O segundo valor é o complemento até 100%. Dados de domicílios, não de escolas nem de estudantes.</desc><rect width="640" height="630" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Aprendizagem digital começa por</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">infraestrutura</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Domicílios particulares permanentes, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">2024</text><text x="44" y="218" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">%</text><path d="M44 264v166" stroke="#e4e8f1"/><text x="44" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">0</text><path d="M154.4 264v166" stroke="#e4e8f1"/><text x="154.4" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">20</text><path d="M264.8 264v166" stroke="#e4e8f1"/><text x="264.8" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">40</text><path d="M375.2 264v166" stroke="#e4e8f1"/><text x="375.2" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">60</text><path d="M485.6 264v166" stroke="#e4e8f1"/><text x="485.6" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">80</text><path d="M596 264v166" stroke="#e4e8f1"/><text x="596" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="end">100</text><text x="44" y="288" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Com utilização de internet</text><text x="596" y="288" font-size="25" fill="#075cf4" font-weight="700" text-anchor="end">93,6%</text><rect x="44" y="300" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="300" width="516.672" height="24" fill="#075cf4" rx="3"/><text x="44" y="368" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Sem utilização de internet</text><text x="596" y="368" font-size="25" fill="#e84452" font-weight="700" text-anchor="end">6,4%</text><rect x="44" y="380" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="380" width="35.328" height="24" fill="#e84452" rx="3"/><path d="M44 462h552" stroke="#c6cedc"/><text x="44" y="491" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">O segundo valor é o complemento até 100%. Dados de domicílios,</text><text x="44" y="515" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">não de escolas nem de estudantes.</text><text x="44" y="562" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: IBGE, PNAD Contínua TIC 2024</text><text x="44" y="598" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>