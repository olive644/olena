<svg xmlns="http://www.w3.org/2000/svg" width="640" height="625" viewBox="0 0 640 625" role="img" aria-labelledby="title description"><title id="title">Envelhecimento: uma dimensão para o cuidado</title><desc id="description">Envelhecimento: uma dimensão para o cuidado. População de 60 anos ou mais, Brasil. Censo 2022, divulgação citada pelo MDHC. Pessoas com 60 anos ou mais: 32,1 milhões de pessoas. Valor arredondado. Idade não equivale a dependência; o indicador não mede necessidade individual de cuidado.</desc><rect width="640" height="625" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Envelhecimento: uma dimensão</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">para o cuidado</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">População de 60 anos ou mais, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Censo 2022, divulgação citada pelo MDHC</text><text x="44" y="303" font-size="88" fill="#075cf4" font-weight="700" text-anchor="start">32,1</text><text x="44" y="358" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">milhões de pessoas</text><text x="44" y="394" font-size="25" fill="#10234c" font-weight="600" text-anchor="start">Pessoas com 60 anos ou mais</text><path d="M44 457h552" stroke="#c6cedc"/><text x="44" y="486" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Valor arredondado. Idade não equivale a dependência; o indicador</text><text x="44" y="510" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">não mede necessidade individual de cuidado.</text><text x="44" y="557" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: MDHC / IBGE, Censo Demográfico 2022</text><text x="44" y="593" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>