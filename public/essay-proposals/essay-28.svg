<svg xmlns="http://www.w3.org/2000/svg" width="640" height="826" viewBox="0 0 640 826" role="img" aria-labelledby="title description"><title id="title">Acesso à justiça: mais do que ingressar em juízo</title><desc id="description">Acesso à justiça: mais do que ingressar em juízo. Atuação da Defensoria Pública. Referência institucional; consulta em 2026. Orientação: Compreender direitos e possibilidades de atuação.; Defesa: Representação dos interesses e direitos.; Gratuidade: Atendimento a quem não pode arcar com os custos.. Síntese das funções apresentadas pelo CNJ. Critérios e atribuições variam conforme a instituição competente.</desc><rect width="640" height="826" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Acesso à justiça: mais do que</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">ingressar em juízo</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Atuação da Defensoria Pública</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Referência institucional; consulta em 2026</text><rect x="44" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Orientação</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Compreender direitos e</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">possibilidades de</text><text x="64" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">atuação.</text><rect x="330" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Defesa</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Representação dos</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">interesses e direitos.</text><rect x="44" y="431" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="462" r="14" fill="#00a459"/><text x="72" y="468" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="511" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Gratuidade</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Atendimento a quem não</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">pode arcar com os</text><text x="64" y="609" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">custos.</text><path d="M44 658h552" stroke="#c6cedc"/><text x="44" y="687" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Síntese das funções apresentadas pelo CNJ. Critérios e</text><text x="44" y="711" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">atribuições variam conforme a instituição competente.</text><text x="44" y="758" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Conselho Nacional de Justiça, Defensoria Pública</text><text x="44" y="794" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>