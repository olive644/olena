<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" role="img" aria-labelledby="title description"><title id="title">Leitura: alcançar o mínimo ainda é um desafio</title><desc id="description">Leitura: alcançar o mínimo ainda é um desafio. Estudantes de 15 anos participantes, Brasil. Pisa 2022. Abaixo do nível 2 em leitura: 50 %; No nível 2 ou acima: 50 %. Valores arredondados. Avaliação de estudantes, não taxa de leitores de toda a população.</desc><rect width="640" height="630" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Leitura: alcançar o mínimo ainda</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">é um desafio</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Estudantes de 15 anos participantes, Brasil</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Pisa 2022</text><text x="44" y="218" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">%</text><path d="M44 264v166" stroke="#e4e8f1"/><text x="44" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">0</text><path d="M154.4 264v166" stroke="#e4e8f1"/><text x="154.4" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">20</text><path d="M264.8 264v166" stroke="#e4e8f1"/><text x="264.8" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">40</text><path d="M375.2 264v166" stroke="#e4e8f1"/><text x="375.2" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">60</text><path d="M485.6 264v166" stroke="#e4e8f1"/><text x="485.6" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">80</text><path d="M596 264v166" stroke="#e4e8f1"/><text x="596" y="252" font-size="14" fill="#59657c" font-weight="400" text-anchor="end">100</text><text x="44" y="288" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Abaixo do nível 2 em leitura</text><text x="596" y="288" font-size="25" fill="#075cf4" font-weight="700" text-anchor="end">50%</text><rect x="44" y="300" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="300" width="276" height="24" fill="#075cf4" rx="3"/><text x="44" y="368" font-size="21" fill="#152644" font-weight="600" text-anchor="start">No nível 2 ou acima</text><text x="596" y="368" font-size="25" fill="#e84452" font-weight="700" text-anchor="end">50%</text><rect x="44" y="380" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="380" width="276" height="24" fill="#e84452" rx="3"/><path d="M44 462h552" stroke="#c6cedc"/><text x="44" y="491" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Valores arredondados. Avaliação de estudantes, não taxa de</text><text x="44" y="515" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">leitores de toda a população.</text><text x="44" y="562" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Inep / OCDE, resultados do Pisa 2022</text><text x="44" y="598" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>