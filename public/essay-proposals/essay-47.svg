<svg xmlns="http://www.w3.org/2000/svg" width="640" height="589" viewBox="0 0 640 589" role="img" aria-labelledby="title description"><title id="title">Deficiência e acesso ao trabalho</title><desc id="description">Deficiência e acesso ao trabalho. Nível de ocupação, pessoas de 14 anos ou mais, Brasil. PNAD Pessoas com Deficiência 2022. Pessoas com deficiência: 26,6 %; Pessoas sem deficiência: 60,7 %. Nível de ocupação não é taxa de desemprego. O indicador relaciona ocupados à população do grupo etário.</desc><rect width="640" height="589" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Deficiência e acesso ao trabalho</text><text x="44" y="104" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Nível de ocupação, pessoas de 14 anos ou mais, Brasil</text><text x="44" y="128" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">PNAD Pessoas com Deficiência 2022</text><text x="44" y="177" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">%</text><path d="M44 223v166" stroke="#e4e8f1"/><text x="44" y="211" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">0</text><path d="M154.4 223v166" stroke="#e4e8f1"/><text x="154.4" y="211" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">20</text><path d="M264.8 223v166" stroke="#e4e8f1"/><text x="264.8" y="211" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">40</text><path d="M375.2 223v166" stroke="#e4e8f1"/><text x="375.2" y="211" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">60</text><path d="M485.6 223v166" stroke="#e4e8f1"/><text x="485.6" y="211" font-size="14" fill="#59657c" font-weight="400" text-anchor="middle">80</text><path d="M596 223v166" stroke="#e4e8f1"/><text x="596" y="211" font-size="14" fill="#59657c" font-weight="400" text-anchor="end">100</text><text x="44" y="247" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Pessoas com deficiência</text><text x="596" y="247" font-size="25" fill="#075cf4" font-weight="700" text-anchor="end">26,6%</text><rect x="44" y="259" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="259" width="146.832" height="24" fill="#075cf4" rx="3"/><text x="44" y="327" font-size="21" fill="#152644" font-weight="600" text-anchor="start">Pessoas sem deficiência</text><text x="596" y="327" font-size="25" fill="#e84452" font-weight="700" text-anchor="end">60,7%</text><rect x="44" y="339" width="552" height="24" fill="#edf0f6" rx="3"/><rect x="44" y="339" width="335.064" height="24" fill="#e84452" rx="3"/><path d="M44 421h552" stroke="#c6cedc"/><text x="44" y="450" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Nível de ocupação não é taxa de desemprego. O indicador relaciona</text><text x="44" y="474" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">ocupados à população do grupo etário.</text><text x="44" y="521" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: MDHC / IBGE, PNAD Pessoas com Deficiência 2022</text><text x="44" y="557" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>