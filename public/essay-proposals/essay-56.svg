<svg xmlns="http://www.w3.org/2000/svg" width="640" height="883" viewBox="0 0 640 883" role="img" aria-labelledby="title description"><title id="title">Racismo: práticas em diferentes contextos</title><desc id="description">Racismo: práticas em diferentes contextos. Síntese educativa de contextos mencionados na legislação. Lei 14.532/2023. Injúria racial: Ofensas raciais dirigidas a uma pessoa.; Contexto recreativo: Práticas racistas não se justificam como diversão.; Dimensão religiosa: Enfrentamento ao racismo em manifestações religiosas.. Síntese de contextos abordados pela lei. Não classifica situações individuais nem resume todas as formas de racismo.</desc><rect width="640" height="883" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Racismo: práticas em diferentes</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">contextos</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Síntese educativa de contextos mencionados na legislação</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Lei 14.532/2023</text><rect x="44" y="218" width="266" height="221" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Injúria racial</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Ofensas raciais</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">dirigidas a uma</text><text x="64" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">pessoa.</text><rect x="330" y="218" width="266" height="221" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Contexto</text><text x="350" y="328" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">recreativo</text><text x="350" y="372" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Práticas racistas não</text><text x="350" y="399" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">se justificam como</text><text x="350" y="426" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">diversão.</text><rect x="44" y="461" width="266" height="218" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="492" r="14" fill="#00a459"/><text x="72" y="498" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="541" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Dimensão religiosa</text><text x="64" y="585" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Enfrentamento ao</text><text x="64" y="612" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">racismo em</text><text x="64" y="639" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">manifestações</text><text x="64" y="666" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">religiosas.</text><path d="M44 715h552" stroke="#c6cedc"/><text x="44" y="744" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Síntese de contextos abordados pela lei. Não classifica situações</text><text x="44" y="768" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">individuais nem resume todas as formas de racismo.</text><text x="44" y="815" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Lei 14.532/2023, enfrentamento ao racismo</text><text x="44" y="851" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>