<svg xmlns="http://www.w3.org/2000/svg" width="640" height="799" viewBox="0 0 640 799" role="img" aria-labelledby="title description"><title id="title">Acolher: uma postura ao longo do cuidado</title><desc id="description">Acolher: uma postura ao longo do cuidado. Encontros entre usuários e serviços de saúde. Política Nacional de Humanização. Escuta: Considerar queixas e preocupações do usuário.; Protagonismo: Reconhecer a participação da pessoa no cuidado.; Responsabilização: Articular respostas e redes de atendimento.. Síntese da diretriz de acolhimento. Não corresponde apenas a recepção, sala ou horário específico.</desc><rect width="640" height="799" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Acolher: uma postura ao longo do</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">cuidado</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Encontros entre usuários e serviços de saúde</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Política Nacional de Humanização</text><rect x="44" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Escuta</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Considerar queixas e</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">preocupações do</text><text x="64" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">usuário.</text><rect x="330" y="218" width="266" height="191" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Protagonismo</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Reconhecer a</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">participação da pessoa</text><text x="350" y="396" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">no cuidado.</text><rect x="44" y="431" width="266" height="164" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="462" r="14" fill="#00a459"/><text x="72" y="468" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="511" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Responsabilização</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Articular respostas e</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">redes de atendimento.</text><path d="M44 631h552" stroke="#c6cedc"/><text x="44" y="660" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Síntese da diretriz de acolhimento. Não corresponde apenas a</text><text x="44" y="684" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">recepção, sala ou horário específico.</text><text x="44" y="731" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: Ministério da Saúde, HumanizaSUS, acolhimento</text><text x="44" y="767" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>