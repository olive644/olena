<svg xmlns="http://www.w3.org/2000/svg" width="640" height="799" viewBox="0 0 640 799" role="img" aria-labelledby="title description"><title id="title">Ciência aberta e confiança pública</title><desc id="description">Ciência aberta e confiança pública. Princípios de produção e circulação do conhecimento. Recomendação UNESCO, 2021. Transparência: Tornar métodos e processos examináveis.; Reprodutibilidade: Criar condições para verificar resultados.; Compartilhamento: Ampliar circulação e cooperação no conhecimento.. Esquema editorial de princípios. Ciência aberta não significa dispensar avaliação crítica ou cuidados éticos.</desc><rect width="640" height="799" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="54" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">Ciência aberta e confiança</text><text x="44" y="95" font-size="34" fill="#10234c" font-weight="700" text-anchor="start">pública</text><text x="44" y="145" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Princípios de produção e circulação do conhecimento</text><text x="44" y="169" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Recomendação UNESCO, 2021</text><rect x="44" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#075cf4" stroke-width="2"/><circle cx="72" cy="249" r="14" fill="#075cf4"/><text x="72" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="64" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Transparência</text><text x="64" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Tornar métodos e</text><text x="64" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">processos examináveis.</text><rect x="330" y="218" width="266" height="164" rx="9" fill="#fff" stroke="#e84452" stroke-width="2"/><circle cx="358" cy="249" r="14" fill="#e84452"/><text x="358" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="350" y="298" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Reprodutibilidade</text><text x="350" y="342" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Criar condições para</text><text x="350" y="369" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">verificar resultados.</text><rect x="44" y="404" width="266" height="191" rx="9" fill="#fff" stroke="#00a459" stroke-width="2"/><circle cx="72" cy="435" r="14" fill="#00a459"/><text x="72" y="441" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="64" y="484" font-size="23" fill="#10234c" font-weight="700" text-anchor="start">Compartilhamento</text><text x="64" y="528" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">Ampliar circulação e</text><text x="64" y="555" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">cooperação no</text><text x="64" y="582" font-size="20" fill="#44516d" font-weight="400" text-anchor="start">conhecimento.</text><path d="M44 631h552" stroke="#c6cedc"/><text x="44" y="660" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">Esquema editorial de princípios. Ciência aberta não significa</text><text x="44" y="684" font-size="17" fill="#44516d" font-weight="400" text-anchor="start">dispensar avaliação crítica ou cuidados éticos.</text><text x="44" y="731" font-size="15" fill="#263957" font-weight="600" text-anchor="start">Fonte: UNESCO, Recomendação sobre Ciência Aberta, 2021</text><text x="44" y="767" font-size="14" fill="#59657c" font-weight="400" text-anchor="start">Elaboração editorial Olena a partir da referência indicada.</text></g></svg>