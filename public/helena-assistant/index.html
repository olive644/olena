<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Helena</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #controls {
        display: none;
      }
    </style>
  </head>
  <body id="stage">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="controls" hidden>
      <span id="hint"></span><button id="pause"></button><button id="replay"></button>
      <span id="status"></span><span id="progress"></span>
    </div>
    <script type="module" src="./runtime.js?v=1"></script>
  </body>
</html>
