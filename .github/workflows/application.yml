name: Application CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Execução completa semanal na main (desktop e mobile), porque o push na main só roda o desktop.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, test, build and performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify application
        run: npm run verify
      - name: Verify system update publication
        run: node --test scripts/generate-system-updates.test.js
      - name: Verify CI scope decision
        run: node --test scripts/ci-scope.test.mjs

  # Decide quanto do e2e roda (ver scripts/ci-scope.mjs). Os checks de resultado abaixo falham
  # se esta decisão falhar, então pular o e2e nunca faz um check obrigatório passar por engano.
  changes:
    name: Decide e2e scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Decide scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-scope.mjs scope

  e2e:
    name: Desktop and mobile smoke tests (${{ matrix.label }})
    needs: changes
    if: ${{ needs.changes.outputs.scope != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Os pacotes do WebKit (cerca de 180, 115 MB) vêm do espelho do Ubuntu e o download já
      # parou por minutos. Com tempo máximo e repetição por arquivo, uma parada vira nova
      # tentativa em vez de travar o job (matar o processo não serve: o apt filho segura o lock).
      - name: Make apt downloads resilient
        run: |
          sudo tee /etc/apt/apt.conf.d/80-ci-downloads >/dev/null <<'APT'
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
      - name: Install browser
        timeout-minutes: 15
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run end-to-end tests
        timeout-minutes: 20
        run: npm run test:e2e -- --project=${{ matrix.project }} --workers=${{ matrix.workers }} --shard=${{ matrix.shard }}
      - name: Verify isolated Helena preview
        timeout-minutes: 5
        run: npx playwright test --config playwright.helena.config.ts --project=${{ matrix.project }} --workers=1 --shard=${{ matrix.shard }}

  # Preserva o check móvel histórico. Na main só o desktop roda (o mobile completo já passou na
  # pull request), e o gate avisa isso em vez de fingir que o mobile rodou.
  mobile-result:
    name: Desktop and mobile smoke tests (mobile)
    needs: [changes, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require the mobile result the scope demands
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: node scripts/ci-scope.mjs gate --job=mobile

  # Mantém o nome histórico do check, para quem exige "Desktop and mobile smoke tests".
  e2e-result:
    name: Desktop and mobile smoke tests
    needs: [changes, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require the e2e result the scope demands
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: node scripts/ci-scope.mjs gate --job=e2e

  dependency-audit:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
      - name: Publish SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download Gitleaks
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --redact -v

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Semgrep
        run: pipx install semgrep==1.174.0
      - name: Scan TypeScript and React
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/react \
            --config=p/nodejs \
            --error \
            --metrics=off
