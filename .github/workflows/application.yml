name: Application CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, test, build and performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify application
        run: npm run verify

  e2e:
    name: Desktop and mobile smoke tests (parte ${{ matrix.shard }} de 2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # A instalação dos navegadores depende da rede do runner e já levou de 46 segundos a mais
      # de 25 minutos (estourando o limite do job). Cada tentativa tem tempo máximo e, se
      # travar, é repetida em vez de gastar o job inteiro.
      - name: Install browsers
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=10s 6m npx playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "Tentativa $attempt da instalação dos navegadores falhou ou passou do tempo."
            sleep 5
          done
          exit 1
      - name: Run end-to-end tests
        timeout-minutes: 20
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

  # Mantém o nome histórico do check, para quem exige "Desktop and mobile smoke tests".
  e2e-result:
    name: Desktop and mobile smoke tests
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every end-to-end part to pass
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "Resultado das partes do e2e: $E2E_RESULT"
          test "$E2E_RESULT" = "success"

  dependency-audit:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
      - name: Publish SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download Gitleaks
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --redact -v

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Semgrep
        run: pipx install semgrep==1.174.0
      - name: Scan TypeScript and React
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/react \
            --config=p/nodejs \
            --error \
            --metrics=off
