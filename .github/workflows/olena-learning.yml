name: Olena learning candidate

on:
  workflow_dispatch:
    inputs:
      force_training:
        description: Explicitly repeat the experiment even if corpus is unchanged
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: olena-learning-public-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Build verified public training and separate evaluation data
        run: python3 scripts/olena_training_data.py
      - name: Restore accepted weights and last experiment report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/restore-olena-training.py
      - name: Install isolated CPU training dependencies
        run: |
          python3 scripts/test_train_olena_candidate.py
          python3 scripts/test_audit_olena_runtime.py
          python3 -m venv .olena-learning/venv
          .olena-learning/venv/bin/python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0
          .olena-learning/venv/bin/pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          .olena-learning/venv/bin/pip install transformers==5.19.0 peft==0.21.2 accelerate==1.15.0 safetensors==0.8.0
      - name: Audit training dependencies before loading weights
        run: |
          .olena-learning/venv/bin/pip install pip-audit==2.10.1
          .olena-learning/venv/bin/pip-audit --progress-spinner off
          .olena-learning/venv/bin/python scripts/audit-olena-runtime.py
      - name: Train and smoke-evaluate actual LoRA weights
        id: train
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HOME: ${{ runner.temp }}/olena-model-cache
          OLENA_FORCE_TRAINING: ${{ inputs.force_training || 'false' }}
        run: .olena-learning/venv/bin/python scripts/train-olena-candidate.py
      - name: Include model licenses
        if: steps.train.outputs.artifact == 'true'
        run: |
          curl --fail --max-time 30 https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/raw/7ae557604adf67be50417f59c2c2f167def9a775/LICENSE -o .olena-learning/candidate/QWEN_LICENSE
      - name: Keep small candidate adapter only, never base weights
        if: steps.train.outputs.artifact == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Olena-Math-Qwen-Candidate-v2
          path: .olena-learning/candidate/
          retention-days: 7
          if-no-files-found: error
      - name: Keep evaluation report even when weights are rejected
        if: always() && steps.train.outputs.report == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Olena-Math-Training-Report-v2
          path: |
            .olena-learning/training-report.json
            .olena-learning/corpus-manifest.json
          retention-days: 30
          if-no-files-found: error
